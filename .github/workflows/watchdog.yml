name: Watch the canvas schedule

on:
  schedule:
    - cron: "47 * * * *"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch a stale canvas run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          cutoff=$((now - 10800))
          runs=$(gh api "repos/$REPOSITORY/actions/workflows/agents.yml/runs?per_page=20")
          latest_success=$(jq -r '[.workflow_runs[] | select(.status == "completed" and .conclusion == "success") | .created_at | fromdateiso8601] | max // 0' <<< "$runs")
          active_runs=$(jq '[.workflow_runs[] | select(.status != "completed")] | length' <<< "$runs")

          if [ "$active_runs" -gt 0 ]; then
            echo "A canvas run is already queued or in progress."
          elif [ "$latest_success" -lt "$cutoff" ]; then
            echo "No successful canvas run in the last three hours; dispatching one."
            gh workflow run agents.yml --repo "$REPOSITORY" --ref main
          else
            echo "Canvas is healthy; no dispatch needed."
          fi
